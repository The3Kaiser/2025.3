// Categorias na ordem
const categorias = ['FPS','Terror','Ação','Sobrevivencia','Indie','RPG','Duplas'];
// Formata BRL
function fmtBR(v) {
  return 'R$ ' + Number(v).toFixed(2).replace('.', ',');
}
// 88% OFF
function discounted(orig) {
  return Number((orig * 0.12).toFixed(2));
}
function renderCatalog() {
  const root = document.getElementById('catalog');
  root.innerHTML = '';
  categorias.forEach(cat => {
    const list = jogos.filter(j => j.categoria === cat);
    if (!list.length) return;
    const sec = document.createElement('section');
    sec.innerHTML = `<h3 class="section-title">${cat}</h3><div class="row gy-3"></div>`;
    const row = sec.querySelector('.row');
    list.forEach(j => {
      const dprice = discounted(j.original);
      const col = document.createElement('div');
      col.className = 'col-md-4';
      col.innerHTML = `
        <div class="card h-100">
          <img src="${j.imagem}" class="card-img-top" alt="${j.nome}">
          <div class="card-body d-flex flex-column">
            <h6 class="card-title">${j.nome}</h6>
            <p class="mb-2 small-muted">De ${fmtBR(j.original)}</p>
            <div class="d-flex justify-content-between align-items-center mt-auto">
              <div class="price">${fmtBR(dprice)}</div>
              <button class="btn btn-purple btn-sm" data-id="${j.id}">Adicionar ao carrinho</button>
            </div>
          </div>
        </div>`;
      row.appendChild(col);
    });
    root.appendChild(sec);
  });
  // Eventos "Adicionar"
  document.querySelectorAll('.btn-purple[data-id]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = e.currentTarget.getAttribute('data-id');
      addToCartById(id);
    });
  });
}
// Carrinho localStorage
const CART_KEY = 'kaptor_cart_v2';
function getCart(){ return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); }
function saveCart(c){ localStorage.setItem(CART_KEY, JSON.stringify(c)); }
function addToCartById(id){
  const game = jogos.find(j => j.id === id);
  if (!game) return;
  const price = discounted(game.original);
  const cart = getCart();
  const exists = cart.find(i => i.id === id);
  if (!exists) {
    cart.push({ id: game.id, nome: game.nome, preco: price, imagem: game.imagem });
    saveCart(cart);
  }
  const go = confirm(`${game.nome} adicionado ao carrinho.\n\nClique em OK para ir ao carrinho ou Cancelar para continuar comprando.`);
  if (go) location.href = 'carrinho.html';
}
document.addEventListener('DOMContentLoaded', renderCatalog);
